<!-- @dsCard group="Components" viewport="700x900" name="Core components" subtitle="Buttons, fields, badges, tags, cards, tabs, accordion, toast" -->
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:#fff}body{padding:20px;font-family:var(--font-body)}.sec{margin-bottom:22px}.lbl{font:600 11px var(--font-label);letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<div id="root"></div>
<script>
// Fallback when the compiled bundle isn't present: compile the sibling .jsx sources in-page.
window.__loadCore = async function(){
  // Prefer the compiled design-system bundle when the compiler has produced it.
  await new Promise(res => { const sc = document.createElement('script'); sc.src = '../../' + '_ds_bundle.js'; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
  let NS = null;
  for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.Accordion) { NS = v; break; } } catch (e) {} }
  if (NS) return NS;
  NS = {};
  const names = ['Button','IconButton','Input','Select','Checkbox','Badge','Tag','Card','Tabs','Accordion','Dialog','Toast'];
  for (const n of names) {
    const src = (await (await fetch(n + '.jsx')).text()).replace(/^import React from 'react';\s*/m,'').replace(/^export function/m,'function');
    const code = Babel.transform(src, { presets: ['react'] }).code;
    NS[n] = new Function('React', code + `\n;return ${n};`)(React);
  }
  return NS;
};
</script>
<script type="text/babel" data-presets="react">
const mount = async () => {
document.getElementById('root').textContent = 'carregando…';
let NS; try { NS = await window.__loadCore(); console.log('NS keys', Object.keys(NS)); } catch (e) { document.getElementById('root').textContent = 'erro: ' + e.message; console.error(e); return; }
const { Button, IconButton, Input, Select, Checkbox, Badge, Tag, Card, Tabs, Accordion, Toast, Dialog } = NS;
const Ic = ({d}) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
const arrow = "M5 12h14M12 5l7 7-7 7";
function App(){
  const [open,setOpen]=React.useState(false);
  return <div>
    <div className="sec"><div className="lbl">Buttons</div><div className="row">
      <Button>Ver produtos</Button><Button variant="accent" iconRight={<Ic d={arrow}/>}>Falar no WhatsApp</Button><Button variant="outline">Orçamento</Button><Button variant="ghost">Saiba mais</Button><Button variant="whatsapp">WhatsApp</Button><Button disabled>Indisponível</Button></div>
      <div className="row" style={{marginTop:10}}><Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg" variant="accent">Large</Button>
      <span style={{background:'var(--surface-dark)',padding:8,borderRadius:6,display:'inline-flex',gap:8}}><Button variant="inverse">Inverse</Button><IconButton label="Menu" variant="inverse"><Ic d="M4 6h16M4 12h16M4 18h16"/></IconButton></span>
      <IconButton label="Buscar"><Ic d="m21 21-4.3-4.3M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z"/></IconButton><IconButton label="Carrinho" variant="solid"><Ic d="M6 6h15l-1.5 9h-12zM6 6 5 3H2"/></IconButton></div></div>
    <div className="sec"><div className="lbl">Fields</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
      <Input label="Nome" placeholder="Seu nome"/><Input label="WhatsApp" placeholder="(62) 9 0000-0000" hint="Só números"/><Input label="E-mail" defaultValue="joao@" error="E-mail inválido"/></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginTop:12,alignItems:'end'}}><Select label="Categoria" options={['Cimento e argamassa','Hidráulica','Elétrica','Tintas','Ferramentas']}/><div className="row" style={{height:46}}><Checkbox label="Receber ofertas" defaultChecked/><Checkbox label="Retirar na loja"/></div></div></div>
    <div className="sec"><div className="lbl">Badges & tags</div><div className="row"><Badge>Entrega grátis</Badge><Badge tone="gold">Até 12x</Badge><Badge tone="solid">Novo</Badge><Badge tone="accent">Promoção</Badge><Badge tone="gray">Esgotado</Badge><Badge tone="success">Em estoque</Badge><Badge tone="danger">Últimas unidades</Badge></div>
      <div className="row" style={{marginTop:10}}><Tag selected>Cimento</Tag><Tag>Hidráulica</Tag><Tag>Elétrica</Tag><Tag onRemove={()=>{}}>Tintas</Tag></div></div>
    <div className="sec"><div className="lbl">Cards</div><div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
      <Card><strong style={{color:'var(--text-heading)'}}>Default</strong><div style={{fontSize:13,color:'var(--text-muted)'}}>Hairline border</div></Card>
      <Card variant="elevated" hoverable><strong style={{color:'var(--text-heading)'}}>Elevated</strong><div style={{fontSize:13,color:'var(--text-muted)'}}>Hover lifts</div></Card>
      <Card variant="brand"><strong>Brand</strong><div style={{fontSize:13,opacity:.8}}>Blue 600</div></Card>
      <Card variant="dark"><strong>Dark</strong><div style={{fontSize:13,opacity:.8}}>Blue 900</div></Card></div></div>
    <div className="sec"><div className="lbl">Tabs & accordion</div><Tabs items={[{value:'a',label:'Unidade 1'},{value:'b',label:'Unidade 2'},{value:'c',label:'Entregas'}]}/>
      <div style={{marginTop:14}}><Accordion items={[{title:'Fazem entrega?',content:'Sim. Entregamos em Goiânia e região; consulte o prazo para o seu bairro.'},{title:'Quais formas de pagamento?',content:'Cartão de débito e crédito, PIX e parcelamento em até 12x (consulte condições).'}]}/></div></div>
    <div className="sec"><div className="lbl">Toast & dialog</div><div className="row" style={{alignItems:'flex-start'}}>
      <Toast tone="success" title="Pedido enviado" onClose={()=>{}}>Retornamos pelo WhatsApp.</Toast><Toast tone="warning" title="Estoque baixo">Restam 3 unidades.</Toast>
      <Button variant="outline" onClick={()=>setOpen(true)}>Abrir dialog</Button></div>
      <Dialog open={open} onClose={()=>setOpen(false)} title="Solicitar orçamento" footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancelar</Button><Button variant="accent">Enviar</Button></>}>Informe os itens e a quantidade; nossa equipe retorna em horário comercial.</Dialog></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
};
mount();
</script>
