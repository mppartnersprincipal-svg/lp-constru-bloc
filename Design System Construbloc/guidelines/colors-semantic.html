<link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:#fff}body{font-family:var(--font-body);color:var(--text-body);padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:90px;height:72px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:600 11px/1.3 var(--font-body);border:1px solid var(--border-default)}.sw small{font-weight:400;opacity:.8;font-family:ui-monospace,monospace;font-size:10px}</style><div class="row"><div class="sw" style="background:var(--cb-success);color:#fff">Success<small>--cb-success</small></div><div class="sw" style="background:var(--cb-warning);color:var(--cb-ink-900)">Warning<small>--cb-warning</small></div><div class="sw" style="background:var(--cb-danger);color:#fff">Danger<small>--cb-danger</small></div><div class="sw" style="background:var(--cb-info);color:#fff">Info<small>--cb-info</small></div></div>
